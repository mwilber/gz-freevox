<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07020f">
    <meta name="csrf-token" content="__CSRF_TOKEN__">
    <title>FreeVox</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/windows11/Square44x44Logo.targetsize-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/windows11/Square44x44Logo.targetsize-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/ios/180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/ios/167.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/ios/152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/ios/120.png">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">FreeVox</p>
          <h1>SELMA Interface</h1>
        </div>
        <button id="logout-button" class="ghost-button" type="button">Log out</button>
      </header>

      <section id="text-panel" class="panel" aria-labelledby="text-title">
        <h2 id="text-title">Quick Message</h2>
        <form id="text-form" class="stack">
          <label>
            <textarea id="text-input" name="text" rows="7" placeholder="Remind me to buy milk tomorrow."></textarea>
          </label>
          <div class="text-actions">
            <button id="dictation-button" class="icon-button" type="button" aria-label="Start voice input" aria-pressed="false">
              <svg class="mic-icon mic-open-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <path d="M12 19v3"></path>
                <path d="M8 22h8"></path>
              </svg>
              <svg class="mic-icon mic-closed-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M9 9v3a3 3 0 0 0 5.12 2.12"></path>
                <path d="M15 9.34V5a3 3 0 0 0-5.94-.6"></path>
                <path d="M17 16.95A7 7 0 0 1 5 12v-2"></path>
                <path d="M19 10v2a6.94 6.94 0 0 1-.72 3.08"></path>
                <path d="M12 19v3"></path>
                <path d="M8 22h8"></path>
                <path d="M2 2l20 20"></path>
              </svg>
            </button>
            <button id="send-button" type="submit">Send</button>
          </div>
          <p id="text-status" class="status" role="status" aria-live="polite">Idle.</p>
        </form>
        <button id="show-voice-button" class="switch-button" type="button">Use Realtime Voice</button>
      </section>

      <section id="voice-panel" class="panel voice-panel" aria-labelledby="voice-title" hidden>
        <h2 id="voice-title">Realtime Voice</h2>
        <div class="voice-actions">
          <button id="start-button" type="button">Start Conversation</button>
          <button id="end-button" class="danger-button" type="button" disabled>End Conversation</button>
        </div>
        <p id="voice-status" class="status" role="status" aria-live="polite">Idle.</p>
        <div class="transcript-box" aria-label="Active conversation transcript">
          <ol id="live-transcript"></ol>
        </div>
        <button id="show-text-button" class="switch-button" type="button">Use Text Input</button>
      </section>
    </main>
    <audio id="remote-audio" autoplay></audio>
    <script src="/app.js?v=20260531-dictation-input" type="module"></script>
  </body>
</html>
